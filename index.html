<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aleksander Dudek</title>
<meta name="description" content="Projects by Aleksander Dudek.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0b0d'/><circle cx='16' cy='16' r='6' fill='%23ffb02e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..125,400..900&family=Instrument+Sans:wght@400;500&family=Spline+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#08090b;--panel:#0f1116;--line:#20242e;--amber:#ffb02e;--phos:#4ade80;
    --text:#eceae5;--dim:#8b90a0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);
    font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.6;
    display:grid;place-items:center;padding:2rem;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:34rem}
  h1{font-family:"Anybody","Arial Narrow",sans-serif;
    font-variation-settings:"wdth" 112,"wght" 850;
    font-size:clamp(1.8rem,6vw,2.6rem);line-height:1;margin:0 0 .4rem;letter-spacing:-.02em}
  .sub{font-family:"Spline Sans Mono",monospace;font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin:0 0 2.4rem}
  a.item{display:flex;align-items:center;gap:.9rem;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);
    padding:1.1rem 1.2rem;transition:border-color .2s,transform .2s}
  a.item:hover{border-color:var(--amber);transform:translateY(-2px)}
  .led{width:8px;height:8px;border-radius:50%;background:var(--phos);
    box-shadow:0 0 10px var(--phos);flex:none}
  .name{font-family:"Anybody",sans-serif;font-variation-settings:"wdth" 108,"wght" 700;
    font-size:1.02rem}
  .what{display:block;color:var(--dim);font-size:.86rem;margin-top:.15rem}
  footer{margin-top:2.4rem;font-family:"Spline Sans Mono",monospace;font-size:.7rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="card">
  <h1>Aleksander Dudek</h1>
  <p class="sub">Projects</p>

  <a class="item" href="./megavideopublisher/">
    <span class="led"></span>
    <span>
      <span class="name">MegaVideoPublisher</span>
      <span class="what">Self-hosted video pipeline — one long video in, a month of posts out.</span>
    </span>
  </a>

  <footer><a href="mailto:adud3k93@gmail.com">adud3k93@gmail.com</a></footer>
</div>
</body>
</html>
