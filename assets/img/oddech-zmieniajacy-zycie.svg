<svg width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2d4a"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tło -->
  <rect width="800" height="1200" fill="url(#bgGrad)"/>
  
  <!-- Siatka w tle -->
  <g opacity="0.03">
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="800" x2="800" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="1000" x2="800" y2="1000" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="1200" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="1200" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="1200" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Dekoracyjne kółka -->
  <circle cx="700" cy="100" r="250" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.08"/>
  <circle cx="100" cy="1100" r="180" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.08"/>
  
  <!-- === NAGŁÓWEK === -->
  <text x="400" y="130" fill="#fff" font-family="Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle">Oddech</text>
  <text x="400" y="195" fill="url(#accentGrad)" font-family="Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle" filter="url(#softGlow)">Kwadratowy</text>
  <text x="400" y="250" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Reset układu nerwowego</text>
  
  <!-- === KWADRAT ODDECHU === -->
  <g transform="translate(240, 380)">
    <!-- Cień / glow kwadratu -->
    <rect x="0" y="0" width="320" height="320" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" opacity="0.4"/>
    
    <!-- Główny kwadrat -->
    <rect x="0" y="0" width="320" height="320" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    
    <!-- Linie strzałek na krawędziach -->
    <line x1="70" y1="0" x2="250" y2="0" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="320" y1="70" x2="320" y2="250" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
    <line x1="250" y1="320" x2="70" y2="320" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="250" x2="0" y2="70" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
    
    <!-- Strzałki -->
    <polygon points="250,0 242,-6 242,6" fill="#3b82f6" opacity="0.5"/>
    <polygon points="320,250 326,242 314,242" fill="#06b6d4" opacity="0.5"/>
    <polygon points="70,320 78,326 78,314" fill="#3b82f6" opacity="0.5"/>
    <polygon points="0,70 -6,78 6,78" fill="#06b6d4" opacity="0.5"/>
    
    <!-- Liczby w rogach -->
    <text x="30" y="50" fill="#fff" font-family="Georgia, serif" font-size="42" font-weight="bold" opacity="0.9">4</text>
    <text x="270" y="50" fill="#fff" font-family="Georgia, serif" font-size="42" font-weight="bold" opacity="0.9">4</text>
    <text x="270" y="305" fill="#fff" font-family="Georgia, serif" font-size="42" font-weight="bold" opacity="0.9">4</text>
    <text x="30" y="305" fill="#fff" font-family="Georgia, serif" font-size="42" font-weight="bold" opacity="0.9">4</text>
    
    <!-- Etykiety faz -->
    <text x="160" y="-25" fill="#3b82f6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2" opacity="0.8">WDECH</text>
    <text x="385" y="165" fill="#06b6d4" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" letter-spacing="2" opacity="0.8">PAUZA</text>
    <text x="160" y="360" fill="#3b82f6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2" opacity="0.8">WYDECH</text>
    <text x="-65" y="165" fill="#06b6d4" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" letter-spacing="2" opacity="0.8">PAUZA</text>
  </g>
  
  <!-- === STOPKA === -->
  
  <!-- Linia oddzielająca -->
  <rect x="360" y="820" width="80" height="3" rx="1" fill="url(#accentGrad)"/>
  
  <!-- Features -->
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">
    <text x="400" y="880" text-anchor="middle">
      <tspan fill="#3b82f6">▸ </tspan>Kurs wideo + 3 nagrania oddechowe
    </text>
    <text x="400" y="920" text-anchor="middle">
      <tspan fill="#3b82f6">▸ </tspan>Technika Navy SEALs
    </text>
    <text x="400" y="960" text-anchor="middle">
      <tspan fill="#3b82f6">▸ </tspan>5-15 minut dziennie
    </text>
  </g>
  
  <!-- Info o dostępie -->
  <text x="400" y="1130" fill="#64748b" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">6 miesięcy dostępu · Natychmiastowy start</text>
  
</svg>
